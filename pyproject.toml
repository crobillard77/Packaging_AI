[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packaging-ai"
version = "1.0.0"
description = "AI-assisted PSADT 3.10.2 packaging (LangGraph CLI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.0",
    "langchain-core>=1.4.0",
    "pydantic>=2.7.0",
    "pywin32>=306; platform_system=='Windows'",
]

[project.optional-dependencies]
llm = ["cursor-sdk>=0.1.0", "langchain-openai>=0.3.0"]
cursor = ["cursor-sdk>=0.1.0"]
openai = ["langchain-openai>=0.3.0"]

[project.scripts]
packaging-ai = "packaging_ai.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["packaging_ai*"]
